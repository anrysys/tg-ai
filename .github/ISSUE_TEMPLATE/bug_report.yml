name: Bug report
description: Something behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a session file, an API hash, or the contents of a private
        conversation into a public issue.** Redact handles and message text.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: tool-output
    attributes:
      label: Tool output
      description: >-
        The text the MCP tool returned, redacted. Tools in this project never
        raise; they return `ERROR:` or `WARNING:` text, which is the useful part.
      render: text
  - type: textarea
    id: whoami
    attributes:
      label: Output of `just tg-status`
      description: >-
        This reports the account, session, database and archive separately, and
        usually identifies which subsystem is at fault. Redact the account name.
      render: text
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code 2.x / Cursor / Codex CLI / ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.12.3
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I ran `just check` and it passed (or I have included the failure)
        - label: I have redacted all credentials, handles and message content
          required: true
