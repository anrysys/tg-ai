name: pages

# The site is what carries JSON-LD, OpenGraph tags and a canonical URL - none of
# which a README on github.com can have. It is generated from that same markdown
# by scripts/build_site.py, and the `site` job in docs.yml proves the committed
# output matches, so this workflow only ever publishes what was reviewed.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deployment: a half-published site is worse than a late
# one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
