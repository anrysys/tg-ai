name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # `python -m` throughout, matching the Justfile exactly. Bare `pytest`
      # puts only `tests/` on sys.path, so `import tg_ai` in conftest fails in
      # CI while `just py-test` passes locally - which is how this went red
      # without anyone noticing.
      - name: Lint
        run: |
          python -m ruff check .
          python -m black --check .

      # The suite is deliberately offline: no Telegram credentials, no
      # database. Every rule that protects the account is a pure function.
      - name: Test
        run: python -m pytest
