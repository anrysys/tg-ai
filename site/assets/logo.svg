<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="50%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="cyan-glow" cx="45%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#0369A1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#080C17" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purple-glow" cx="55%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080C17" stop-opacity="0" />
    </radialGradient>

    <!-- Shield & Emblem Gradients -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="shield-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Plane Wing Facet Gradients -->
    <linearGradient id="plane-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="plane-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <linearGradient id="plane-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <linearGradient id="trail-grad-1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="trail-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="title-tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="title-ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="30" cy="0" r="0.8" fill="#38BDF8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="380" rx="20" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />
  <rect width="850" height="380" rx="20" fill="url(#grid)" />

  <!-- Ambient Light Spots -->
  <circle cx="380" cy="120" r="190" fill="url(#cyan-glow)" />
  <circle cx="470" cy="130" r="180" fill="url(#purple-glow)" />

  <!-- ==================== CENTRAL EMBLEM ==================== -->
  <g transform="translate(425, 125)">
    <!-- Circuit Lines Background -->
    <g opacity="0.4" stroke-width="1.2" fill="none">
      <path d="M -130 -40 L -80 -40 L -60 -20" stroke="#38BDF8" />
      <circle cx="-130" cy="-40" r="2.5" fill="#38BDF8" />
      <circle cx="-60" cy="-20" r="1.5" fill="#38BDF8" />

      <path d="M -120 40 L -70 40 L -50 20" stroke="#38BDF8" />
      <circle cx="-120" cy="40" r="2.5" fill="#38BDF8" />

      <path d="M 130 -40 L 80 -40 L 60 -20" stroke="#C084FC" />
      <circle cx="130" cy="-40" r="2.5" fill="#C084FC" />

      <path d="M 120 40 L 70 40 L 50 20" stroke="#C084FC" />
      <circle cx="120" cy="40" r="2.5" fill="#C084FC" />
    </g>

    <!-- Outer Tech Hex-Shield (The Send Guard Badge) -->
    <polygon points="0,-88 76,-44 76,44 0,88 -76,44 -76,-44"
             fill="url(#shield-grad)"
             stroke="url(#shield-stroke)"
             stroke-width="2.5"
             filter="url(#soft-glow)" />

    <!-- Inner Shield Inset -->
    <polygon points="0,-76 66,-38 66,38 0,76 -66,38 -66,-38"
             fill="none"
             stroke="#1E293B"
             stroke-width="1"
             stroke-dasharray="8 6" />

    <!-- Shield Corner Guard Nodes -->
    <circle cx="0" cy="-88" r="3.5" fill="#38BDF8" filter="url(#soft-glow)" />
    <circle cx="76" cy="-44" r="3" fill="#818CF8" />
    <circle cx="76" cy="44" r="3" fill="#C084FC" />
    <circle cx="0" cy="88" r="3.5" fill="#10B981" filter="url(#soft-glow)" />
    <circle cx="-76" cy="44" r="3" fill="#818CF8" />
    <circle cx="-76" cy="-44" r="3" fill="#38BDF8" />

    <!-- Orbital Cyber Ring (Dynamic Tilt) -->
    <g transform="rotate(-28)">
      <ellipse cx="0" cy="0" rx="104" ry="40"
               fill="none"
               stroke="url(#shield-stroke)"
               stroke-width="1.2"
               stroke-dasharray="14 10 4 10"
               opacity="0.75" />
      <!-- Orbit Satellite Nodes -->
      <circle cx="104" cy="0" r="3.5" fill="#38BDF8" filter="url(#soft-glow)" />
      <circle cx="-104" cy="0" r="2.5" fill="#C084FC" />
      <circle cx="45" cy="36" r="2" fill="#38BDF8" opacity="0.8" />
    </g>

    <!-- Warp / Energy Streams behind the plane -->
    <path d="M -8 -4 L -95 32" stroke="url(#trail-grad-1)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M 8 20 L -80 62" stroke="url(#trail-grad-2)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <path d="M -22 10 L -115 48" stroke="url(#trail-grad-1)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

    <!-- Supersonic Stealth Paper Plane (Centered & Angled) -->
    <g id="plane" filter="url(#soft-glow)">
      <!-- Main Upper Wing Facet -->
      <polygon points="46,-42 -48,-3 -6,14"
               fill="url(#plane-top)" />

      <!-- Main Lower Wing Facet -->
      <polygon points="46,-42 -6,14 14,46"
               fill="url(#plane-bottom)" />

      <!-- Inner Origami Fold / Keel -->
      <polygon points="-6,14 -22,28 14,46"
               fill="url(#plane-fold)" />

      <!-- Fold Accent / Shadow Plate -->
      <polygon points="-6,14 -22,28 -14,10"
               fill="#4C1D95"
               opacity="0.9" />

      <!-- Center Crease High-Voltage Line -->
      <line x1="46" y1="-42" x2="-6" y2="14"
            stroke="#FFFFFF"
            stroke-width="1.8"
            stroke-linecap="round" />

      <!-- Glowing Wingtip Lights -->
      <circle cx="46" cy="-42" r="2.5" fill="#FFFFFF" filter="url(#soft-glow)" />
      <circle cx="-48" cy="-3" r="2" fill="#38BDF8" />
      <circle cx="14" cy="46" r="2" fill="#C084FC" />
    </g>

    <!-- AI Intelligence Sparks / Synaptic Nodes -->
    <!-- 4-point Diamond Star (Forward Spark) -->
    <path d="M 68 -54 Q 68 -46 76 -46 Q 68 -46 68 -38 Q 68 -46 60 -46 Q 68 -46 68 -54 Z"
          fill="#38BDF8"
          filter="url(#soft-glow)" />

    <path d="M -54 -48 Q -54 -43 -49 -43 Q -54 -43 -54 -38 Q -54 -43 -59 -43 Q -54 -43 -54 -48 Z"
          fill="#C084FC"
          opacity="0.8" />

    <!-- Small Synapse Node Connections -->
    <circle cx="58" cy="18" r="2" fill="#38BDF8" opacity="0.7" />
    <circle cx="-42" cy="-34" r="1.5" fill="#818CF8" opacity="0.6" />
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <!-- Main Title: TG · AI -->
  <g text-anchor="middle">
    <text x="425" y="254">
      <tspan fill="url(#title-tg)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="36" letter-spacing="4">TG</tspan>
      <tspan fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30"> · </tspan>
      <tspan fill="url(#title-ai)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="36" letter-spacing="4">AI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="425" y="280"
          fill="#94A3B8"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif"
          font-weight="600"
          font-size="12.5"
          letter-spacing="2.8">
      AI AGENT INTERFACE FOR PERSONAL TELEGRAM
    </text>
  </g>

  <!-- ==================== FEATURE BADGES ==================== -->
  <g transform="translate(114, 312)">
    <!-- Badge 1: MTProto API -->
    <g transform="translate(0, 0)">
      <rect width="110" height="26" rx="13" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
      <circle cx="15" cy="13" r="3.5" fill="#38BDF8" />
      <text x="27" y="16.5" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5" letter-spacing="0.6">MTPROTO API</text>
    </g>

    <!-- Badge 2: FastMCP Stdio -->
    <g transform="translate(120, 0)">
      <rect width="120" height="26" rx="13" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
      <circle cx="15" cy="13" r="3.5" fill="#818CF8" />
      <text x="27" y="16.5" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5" letter-spacing="0.6">FASTMCP STDIO</text>
    </g>

    <!-- Badge 3: Send Guard -->
    <g transform="translate(250, 0)">
      <rect width="114" height="26" rx="13" fill="#0B132B" stroke="#065F46" stroke-width="1" />
      <circle cx="15" cy="13" r="3.5" fill="#10B981" />
      <text x="27" y="16.5" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.6">SEND GUARD</text>
    </g>

    <!-- Badge 4: Local Archive -->
    <g transform="translate(374, 0)">
      <rect width="120" height="26" rx="13" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
      <circle cx="15" cy="13" r="3.5" fill="#C084FC" />
      <text x="27" y="16.5" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5" letter-spacing="0.6">LOCAL ARCHIVE</text>
    </g>

    <!-- Badge 5: 127.0.0.1 Safe -->
    <g transform="translate(504, 0)">
      <rect width="118" height="26" rx="13" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
      <circle cx="15" cy="13" r="3.5" fill="#F59E0B" />
      <text x="27" y="16.5" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5" letter-spacing="0.6">127.0.0.1 SAFE</text>
    </g>
  </g>
</svg>

